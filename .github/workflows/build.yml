name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller yt-dlp
    
    - name: Download FFmpeg
      run: |
        Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n9.0-latest-win64-gpl-9.0.zip" -OutFile "ffmpeg.zip"
        Expand-Archive -Path ffmpeg.zip -DestinationPath .
    
    - name: Build EXE
      run: |
        pyinstaller --onefile --windowed --add-data "ffmpeg-n9.0-latest-win64-gpl-9.0;ffmpeg" video_downloader.py
        Move-Item -Path dist/video_downloader.exe -Destination dist/VideoDownloader.exe
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: VideoDownloader-Windows
        path: dist/VideoDownloader.exe
